<div id="loading-screen">Loading Outreach Hub…</div>
<div id="root"></div>

<!-- =========================================================
     API URL — the only thing you ever need to change here.

     This used to live in a separate config.js. It is inlined now on
     purpose: a separate file can 404, be caught by .gitignore, or be
     served from a stale cache, and when it does the whole app dies with
     "API_URL is not defined". One line in the page that loads it cannot
     go missing.

     Get the value from: Apps Script > Deploy > Manage deployments >
     copy the URL under the active deployment. It must end in /exec.

     (A config.js is still honoured if you keep one — see js-core.js.)
     ========================================================= -->
<script>
  window.API_URL = 'https://script.google.com/macros/s/AKfycbwPBQSYmuOCGR5rLiEy7yBhhtRKCQXXfs8i1Jej-H9ERqD35gDC_4Nw4V11VP_pdprO/exec';
</script>

<!-- The ?v= on each file is a cache buster. Bump it whenever you deploy,
     so browsers and the GitHub Pages CDN cannot serve yesterday's
     JavaScript against today's page. -->
<script src="js-core.js?v=20260807c"></script>
<script src="js-schedule.js?v=20260807c"></script>
<script src="js-charity.js?v=20260807c"></script>
<script src="js-docs.js?v=20260807c"></script>
<script src="js-logistics.js?v=20260807c"></script>
<script src="js-badges.js?v=20260807c"></script>
<script src="js-team.js?v=20260807c"></script>
<script src="js-boot.js?v=20260807c"></script>
</body>
</html>
